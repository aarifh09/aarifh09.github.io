<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Aarif Hussain — MEPF Design Engineer</title>
<meta name="description" content="MEPF Design Engineer specializing in HVAC, Electrical, Plumbing & Fire Safety for healthcare, infrastructure and telecom projects in India and the Middle East." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600;9..144,700;9..144,800;9..144,900&famil[...]"
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<style>
/* ===================== RESET & GLOBAL ===================== */
* { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior:smooth; }
h1 {
  line-height: 1.2;
  padding-bottom: 10px;
}
  :root{
  --bg: #f7f5f1;
  --bg-2: #ffffff;
  --bg-3: #efece6;
  --ink: #0a0a0a;
  --ink-2: #1a1a1a;
  --muted: #6b6b6b;
  --line: #e6e2d9;
  --accent: #ff5b1f;
  --accent-2: #ffb43c;
  --accent-soft: #fff1e6;
  --green: #2f7d4d;
  --shadow-sm: 0 4px 14px rgba(20,20,20,.06);
  --shadow-md: 0 16px 40px rgba(20,20,20,.08);
  --shadow-lg: 0 30px 80px rgba(20,20,20,.12);
  --radius: 22px;
  --radius-sm: 14px;
}
html, body{
  background: var(--bg);
  color: var(--ink);
  font-family: 'Inter', system-ui, sans-serif;
  font-weight:400;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
img{ max-width:100%; display:block; }
a{ color:inherit; text-decoration:none; }
::selection{ background: var(--accent); color:#fff; }
/* Custom cursor */
.cursor{
  position:fixed; top:0; left:0; width:14px; height:14px;
  background: var(--accent); border-radius:50%;
  pointer-events:none; z-index:9999;
  mix-blend-mode: multiply;
  transition: transform .18s ease, width .25s ease, height .25s ease, background .25s ease;
  transform: translate(-50%,-50%);
}
.cursor.grow{ width:54px; height:54px; background: rgba(255,91,31,.25); }
@media (max-width: 900px){ .cursor{ display:none; } }

/* ===================== LOADER ===================== */
.loader{
  position:fixed; inset:0; background:var(--bg);
  display:flex; align-items:center; justify-content:center;
  z-index:10000; flex-direction:column; gap:24px;
}
.loader-logo{
  font-family:'Fraunces', serif; font-size:42px; font-weight:600;
  letter-spacing:-1px; position:relative; overflow:hidden; height:54px;
}
.loader-logo span{ display:inline-block; transform:translateY(60px); }
.loader-bar{
  width:240px; height:2px; background: var(--line); position:relative; overflow:hidden;
}
.loader-bar::before{
  content:""; position:absolute; left:0; top:0; height:100%;
  width:100%; background: var(--ink);
  transform:translateX(-100%);
  animation: loadBar 1.6s cubic-bezier(.7,0,.3,1) forwards;
}
@keyframes loadBar{
  0%{ transform:translateX(-100%); }
  100%{ transform:translateX(0%); }
}

/* ===================== NAV ===================== */
.nav{
  position:fixed; top:0; left:0; right:0; z-index:100;
  padding: 22px 48px;
  display:flex; justify-content:space-between; align-items:center;
  transition: all .4s ease;
  backdrop-filter: blur(0px);
}
.nav.scrolled{
  background: rgba(247,245,241,.85);
  backdrop-filter: blur(14px);
  padding: 14px 48px;
  border-bottom:1px solid var(--line);
}
.nav-logo{
  font-family:'Fraunces',serif; font-size:22px; font-weight:600; letter-spacing:-.5px;
  display:flex; align-items:center; gap:8px;
}
.nav-logo .dot{
  width:10px; height:10px; border-radius:50%; background:var(--accent);
  box-shadow:0 0 0 4px var(--accent-soft);
  animation: pulseDot 2s infinite;
}
@keyframes pulseDot{
  0%,100%{ transform:scale(1); }
  50%{ transform:scale(1.25); }
}
.nav-links{ display:flex; gap:36px; }
.nav-links a{
  font-size:14px; font-weight:500; color:var(--ink-2);
  position:relative; padding:6px 0;
  transition:color .3s;
}
.nav-links a::after{
  content:""; position:absolute; left:0; bottom:0; width:0; height:1px;
  background: var(--accent); transition: width .3s ease;
}
.nav-links a:hover{ color:var(--accent); }
.nav-links a:hover::after{ width:100%; }
.nav-cta{
  display:inline-flex; align-items:center; gap:8px;
  padding:10px 18px; background:var(--ink); color:#fff;
  border-radius:100px; font-size:13px; font-weight:500;
  transition: transform .3s ease, background .3s;
}
.nav-cta:hover{ background:var(--accent); transform:translateY(-2px); }
.nav-cta .arrow{
  display:inline-block; transition: transform .3s;
}
.nav-cta:hover .arrow{ transform: translate(2px,-2px); }
.menu-btn{ display:none; background:none; border:none; cursor:pointer; }
@media (max-width:900px){
  .nav{ padding: 18px 22px; }
  .nav.scrolled{ padding:12px 22px; }
  .nav-links{ display:none; }
  .nav-cta{ padding:8px 14px; font-size:12px; }
}

/* ===================== HERO ===================== */
.hero{
  min-height: 100vh;
  padding: 140px 48px 80px;
  position:relative;
  display:flex; flex-direction:column; justify-content:center;
  overflow:hidden;
}
.hero-bg{
  position:absolute; inset:0; pointer-events:none; z-index:0;
}
.hero-grid{
  position:absolute; inset:0;
  background-image:
    linear-gradient(rgba(10,10,10,.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(10,10,10,.04) 1px, transparent 1px);
  background-size: 80px 80px;
  mask-image: radial-gradient(ellipse 80% 60% at 50% 40%, #000 30%, transparent 100%);
  -webkit-mask-image: radial-gradient(ellipse 80% 60% at 50% 40%, #000 30%, transparent 100%);
}
.blob{
  position:absolute; border-radius:50%;
  filter: blur(70px); opacity:.55;
  animation: float 12s ease-in-out infinite;
}
.blob.b1{
  width:480px; height:480px; background:#ffd9c2; top:-120px; right:-100px;
}
.blob.b2{
  width:380px; height:380px; background:#cfe8d8; bottom:-100px; left:-80px;
  animation-delay:-4s;
}
.blob.b3{
  width:300px; height:300px; background:#ffe8b3; top:40%; left:50%;
  animation-delay:-8s; opacity:.35;
}
@keyframes float{
  0%,100%{ transform: translate(0,0) scale(1); }
  33%{ transform: translate(40px,-30px) scale(1.05); }
  66%{ transform: translate(-30px,40px) scale(.95); }
}
.hero-inner{ position:relative; z-index:1; max-width:1400px; margin:0 auto; width:100%; }
.hero-tag{
  display:inline-flex; align-items:center; gap:10px;
  padding:8px 16px; background: var(--bg-2);
  border:1px solid var(--line); border-radius:100px;
  font-size:13px; font-weight:500; color:var(--ink-2);
  box-shadow: var(--shadow-sm);
  margin-bottom: 36px;
}
.hero-tag .live{
  width:8px; height:8px; border-radius:50%; background: var(--green);
  box-shadow: 0 0 0 4px rgba(47,125,77,.18);
  animation: pulseDot 1.6s infinite;
}
.hero-title{
  font-family:'Fraunces', serif;
  font-size: clamp(48px, 9vw, 144px);
  line-height: .92; letter-spacing:-.04em;
  font-weight:500; margin-bottom: 28px;
}
.hero-title .ln{ display:block; overflow:hidden; }
.hero-title .ln > span{ display:inline-block; will-change: transform; }
.hero-title em{
  font-style: italic; font-weight:400;
  background: linear-gradient(90deg, var(--accent), var(--accent-2));
  -webkit-background-clip: text; background-clip:text; color:transparent;
}
.hero-sub{
  max-width: 640px; font-size: clamp(16px,1.5vw,20px);
  line-height:1.55; color:var(--muted); margin-bottom:48px;
  font-weight:400;
}
/* (rest of original file omitted for brevity) */
</style>
</head>
<body>

<!-- LOADER -->
<div class="loader" id="loader">
  <div class="loader-logo"><span id="loaderLogo">Aarif Hussain.</span></div>
  <div class="loader-bar"></div>
</div>

<!-- CUSTOM CURSOR -->
<div class="cursor" id="cursor"></div>

<!-- NAV -->
<nav class="nav" id="nav">
  <a href="#" class="nav-logo"><span class="dot"></span> Aarif<span style="color:var(--accent);">.</span></a>
  <div class="nav-links">
    <a href="#services">Services</a>
    <a href="#projects">Projects</a>
    <a href="#case">Case Study</a>
    <a href="#experience">Experience</a>
    <a href="#skills">Skills</a>
    <a href="#process">Process</a>
    <a href="#contact">Contact</a>
  </div>
  <a href="#contact" class="nav-cta">Hire Me <span class="arrow">↗</span></a>
</nav>

<!-- HERO -->
<section class="hero" id="home">
  <div class="hero-bg">
    <div class="hero-grid"></div>
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
  </div>
  <div class="hero-inner">
    <div class="hero-tag reveal"><span class="live"></span> Open to Work — Srinagar · Remote · Hybrid · 2026</div>
<!-- (rest of original body omitted for brevity) -->

<!-- Script: prepend TransArab Design Consultancy experience entry to #experience -->
<script>
document.addEventListener('DOMContentLoaded', function(){
  try{
    var html = '\n<div class="exp-entry" style="margin-bottom:24px; padding:20px; border-radius:14px; background:var(--bg-2); border:1px solid var(--line);">\n  <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;">\n    <div>\n      <div style="font-family:Fraunces, serif; font-weight:600; font-size:18px;">Design Engineer — TransArab Design Consultancy</div>\n      <div style="font-size:13px; color:var(--muted); margin-top:6px;">Srinagar, Jammu and Kashmir · Jun 2026 — Present</div>\n    </div>\n  </div>\n  <p style="margin-top:12px; color:var(--muted);">MEPF design & coordination for HVAC, plumbing, electrical and fire safety; preparing drawings, calculations and coordinating with architects and contractors.</p>\n</div>\n';

    var exp = document.getElementById('experience');
    if(exp){
      var container = exp.querySelector('.section-inner') || exp;
      var temp = document.createElement('div');
      temp.innerHTML = html;
      var first = temp.firstElementChild;
      if(first){
        container.insertBefore(first, container.firstChild);
      }
    } else {
      // create a new experience section at top of main content
      var section = document.createElement('section');
      section.id = 'experience';
      section.className = 'section';
      section.innerHTML = '<div class="section-inner">' + html + '</div>';
      // insert after hero if present, otherwise at body start
      var hero = document.getElementById('home');
      if(hero && hero.parentNode){
        hero.parentNode.insertBefore(section, hero.nextSibling);
      } else {
        document.body.insertBefore(section, document.body.firstChild);
      }
    }
  }catch(e){console.error('Failed to insert TransArab experience entry', e);} 
});
</script>

</body>
</html>
